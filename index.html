<!DOCTYPE html>
<html lang="en">
    <head>
        <title>User Survey</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    </head>
    <body>
        <form>
            <h2>Lifestyle Survey</h2>
            <p>Tell us more about yourself and your interest!</p>
            <br>
            Enter Your Name:
            <br>
            <label for="fname">
             <i class="fa-solid fa-user"></i> First Name:
             </label><br>

           <input type="text" id="fname" name="fname"><br>


           <label for="lname">
            <i class="fa-solid fa-user"></i> Last Name:
           </label><br>

            <input type="text" id="lname" name="lname">
            <br><br>
            <label for="email">
            <i class="fa-solid fa-envelope"></i> Email:
            </label><br>
            <input type="email" id="email" name="email">
             <br><br>
             <i class="fa-solid fa-dumbbell"></i> Do you Exercise at the Home?
            <br>
              <input type="radio" id="Yes"
              name="Do you Exercise at Home?" value="Yes">
              <label for="html">Yes</label>
              <input type="radio" id="No"
              name="Do you Exercise at Home?" value="No">
              <label for="No">No</label>
              <br><br>
              How do you like to read your favorite Topics?
              <br>
              <input type="checkbox" id="Books" name="Books" value="Books">
              <label for="Books">Books</label><br>
              <input type="checkbox" id="Online Resources"
              name="Online Resources" value="Online Resources">
              <label for="Online Resources">Online Resources</label><br>
              <input type="checkbox" id="Applications"
              name="Online Resources" value="Applications">
              <label for="Online Resources">Aplications</label><br>
              <br>
              <br>
              <input type="submit" value="Submit">
        </form>
    </body>
</html>
