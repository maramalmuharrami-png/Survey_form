<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application Form</title>
<link rel="stylesheet" href="style2.css">
</head>
<body>
    <form action="#" method="post" enctype="multipart/form-data">
        <h2>Kanz Program</h2>
<br>
<label for="first-name">First Name:</label>
<input type="text" id="first-name" name="first_name">
<span id="first-name-error"></span>
<br><br>

<label for="last-name">Last Name:</label>
<input type="text" id="last-name" name="last_name">
<span id="last-name-error"></span>
<br><br>

<label for="email">Email:</label>
<input type="email" id="email" name="email">
<span id="email-error"></span>
<br><br>
<label>Your Gender:</label>
<br><br>
<input type="radio" id="male" name="gender" value="male">Male
<br><br>
<input type="radio" id="female" name="gender" value="female">Female
<br><br>
<label>Your Degree:</label>
<select>
    <option>Diploma</option>
    <option>Bachelors</option>
    <option>Master</option>
    <option>Doctorate</option>
</select>
<br><br>
<label>Select Your Major:</label>
<select>
    <option>Information Technology</option>
    <option>Software Engineering</option>
    <option>Computer Science</option>
    <option>Computer Engineering</option>
</select>
<br><br>
<label for="gpa">Your GPA Out Of 4:</label>
 <input type="number" id="gpa" name="gpa" min="0" max="4" step="0.01" placeholder="e.g. 3.75" required>
<br><br>
<label>Years of Experience:</label>
<select>
    <option>0</option>
    <option>1</option>
    <option>2</option>
    <option>3</option>
    <option>more than 3</option>
</select>
<br><br>
<label>Programming Languages You Know:</label>
<br><br>
<input type="checkbox" id="python" name="languages" value="python">
<label for="python">Python</label>
<br>
<input type="checkbox" id="java" name="languages" value="java">
<label for="java">Java</label>
<br>
<input type="checkbox" id="javascript" name="languages" value="javascript">
<label for="javascript">JavaScript</label>
<br>
<input type="checkbox" id="cpp" name="languages" value="cpp">
<label for="cpp">C++</label>
<br>
<input type="checkbox" id="php" name="languages" value="php">
 <label for="php">PHP</label>
 <br>
 <input type="checkbox" id="html" name="languages" value="html">
 <label for="html">Html</label>
 <br>
 <input type="checkbox" id="css" name="languages" value="css">
 <label for="css">Css</label>
<br><br>

<label for="cv">Attach your CV (PDF or Word):</label>
<br><br>
<input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx" required>
<br><br>

<label for="degree">Degree Certificate (PDF or Word):</label>
<br><br>
<input type="file" id="degree" name="degree" accept=".pdf,.doc,.docx" required>
<br><br>

<label for="academic-transcript">Academic Certificate (PDF):</label>
<br><br>
<input type="file" id="academic-transcript" name="academic_transcript" accept=".pdf" required>
<br><br>

<label for="id-card">ID Card (PDF Or JPG):</label>
<br><br>
<input type="file" id="id-card" name="id_card" accept=".pdf,.jpg" required>
<br><br>

<label>Summary of your Experience and Skills:</label>
<br><br>
<textarea rows="10" cols="20"></textarea>
<br><br>

<button type="submit" id="submit-btn">submit</button>
<p id="success-message"></p>


    </form>

    <script src="script.js"></script>
</body>
</html>
